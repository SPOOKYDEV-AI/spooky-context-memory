name: Reliability Gauntlet

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: Pure generated cases per shard
        required: false
        default: "250000"
      model_scenarios:
        description: Stateful filesystem scenarios per platform job
        required: false
        default: "100"

permissions:
  contents: read

concurrency:
  group: reliability-gauntlet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generated-properties:
    name: Generated properties / shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run generated property and mutation gauntlet
        env:
          SPOOKY_GAUNTLET_CASES: ${{ inputs.cases || '250000' }}
          SPOOKY_GAUNTLET_SHARD: ${{ matrix.shard }}
        run: >-
          npx vitest run
          tests/persistence-property-gauntlet.test.ts
          tests/persistence-mutation-gauntlet.test.ts
          --reporter=verbose

  cross-platform-state-machine:
    name: Stateful gauntlet / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run stateful, crash, lock, backup and recovery gauntlet
        env:
          SPOOKY_MODEL_SCENARIOS: ${{ inputs.model_scenarios || '100' }}
          SPOOKY_MODEL_STEPS: "40"
          SPOOKY_GAUNTLET_SHARD: "1"
        run: >-
          npx vitest run
          tests/persistence-model-gauntlet.test.ts
          tests/persistence-lock-fault-gauntlet.test.ts
          tests/persistence-snapshot-backup-gauntlet.test.ts
          tests/persistence-health-report.test.ts
          tests/persistence-recovery-compaction.test.ts
          tests/deterministic-replay.test.ts
          --reporter=verbose
