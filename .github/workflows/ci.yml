name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run check

      - name: Package smoke test
        run: npm pack --dry-run

      - name: CLI smoke test
        shell: bash
        run: |
          node -e 'const p = require("./package.json"); if (p.bin?.["spooky-memory"] !== "./dist/cli/spooky-memory.js") process.exit(1)'
          node dist/cli/spooky-memory.js help
